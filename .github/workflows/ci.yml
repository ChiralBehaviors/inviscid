name: CI

# This repo commits directly to master, so the push build IS the gate -- there is
# no PR check upstream of it and nothing is tested twice. The pull_request trigger
# is here for the occasional branch; a tree that passed as a PR is not re-tested on
# merge, because the paths filter and concurrency group below keep the gate single.
on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'pom.xml'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'pom.xml'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

# Back-to-back pushes must not stack full runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # ubuntu only. The suite is headless by construction -- no JavaFX toolkit is
    # started -- so there is nothing here that needs a macOS or Windows runner.
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      # Temurin 21 rather than the author's local GraalVM 25: both satisfy the
      # project's source/target 20, and building on a different JDK is what makes
      # this a check rather than a mirror of one machine.
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # -DskipLga drops the retired LGA arc's tests (epic inviscid-0nx, closed by
      # owner decision). They were 799s of a 932s run -- 86%, HybridAutomatonTest
      # alone 34% -- on an arc that is not under development. The flag is on the
      # command line rather than defaulted in the pom so that this exclusion is
      # visible at the gate, and so a plain `mvn test` locally still runs the
      # whole suite for whoever picks up inviscid-1zr / yj3 / 8uh / ip2.
      #
      # Accepted gap: the core sits under both arcs, so a core change can break
      # LGA without CI noticing. Recovery is `mvn test` with no property.
      - name: Build and test
        run: mvn -B -ntp -Djava.awt.headless=true -DskipLga test

      # Surefire's per-test detail is the only thing worth keeping off a red run,
      # and it costs nothing on a green one.
      - name: Upload surefire reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7
